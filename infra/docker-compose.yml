version: '3.8'

services:
  nextjs:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - SITE_DOMAIN=daniel-gadgets.com
    ports:
      - '3000:3000'
    depends_on:
      - backend

  backend:
    build: ./fullstack/backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://daniel-gadgets.com,https://featured.daniel-gadgets.com,https://reviews.daniel-gadgets.com,https://contact.daniel-gadgets.com,https://api.daniel-gadgets.com,http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      - ./fullstack/backend/data:/app/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nextjs
      - backend
