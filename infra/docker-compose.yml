version: '3.8'

services:
  # Backend API
  backend:
    build: ./fullstack/backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://gadgets.local,http://api.gadgets.local,http://products.gadgets.local,http://daniel-gadgets.com,http://api.daniel-gadgets.com,http://products.daniel-gadgets.com
    ports:
      - '5000:5000'
    volumes:
      - ./fullstack/backend/data:/app/data

  # Nginx Reverse Proxy & Static File Server
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/usr/share/nginx/html:ro
    depends_on:
      - backend
