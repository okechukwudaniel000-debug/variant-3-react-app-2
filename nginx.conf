worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Main Site - gadgets.local or daniel-gadgets.com
    server {
        listen 80;
        server_name gadgets.local daniel-gadgets.com;

        location / {
            root /usr/share/nginx/html;
            index gadgets.html;
            try_files $uri $uri/ /gadgets.html;
        }
    }

    # API Subdomain - api.gadgets.local or api.daniel-gadgets.com
    server {
        listen 80;
        server_name api.gadgets.local api.daniel-gadgets.com;

        location / {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }

    # Products Subdomain - products.gadgets.local or products.daniel-gadgets.com
    server {
        listen 80;
        server_name products.gadgets.local products.daniel-gadgets.com;

        location / {
            root /usr/share/nginx/html;
            index products.html;
            try_files $uri $uri/ /products.html;
        }
    }
}
